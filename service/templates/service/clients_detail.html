{% extends 'service/base.html' %}
{% block title %}clients_detail{% endblock %}
{% block content %}
<h1 class="text-center mt-5">Информация о клиенте</h1>
<table class="table table-dark table-striped mt-5">
    <thead>
    <tr>
        <th scope="col" class="text-uppercase">id</th>
        <th scope="col" class="text-uppercase">email</th>
        <th scope="col" class="text-uppercase">ФИО</th>
        <th scope="col" class="text-uppercase">Комментарий</th>
        <th scope="col" class="text-uppercase"></th>
        <th scope="col" class="text-uppercase"></th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <th scope="row" class="fst-italic">{{ object.pk }}</th>
        <td class="fst-italic">{{ object.email }}</td>
        <td class="fst-italic">{{ object.name }}</td>
        <td class="fst-italic">{{ object.comment }}</td>
        <td><a href="{% url 'service:clients_update' object.pk %}"><button type="button" class="btn btn-outline-primary btn-sm">Редактировать</button></a></td>
        <td><a href="{% url 'service:clients_delete' object.pk %}"><button type="button" class="btn btn-outline-danger btn-sm">Удалить</button></a></td>
    </tr>
</table>
{% endblock %}
