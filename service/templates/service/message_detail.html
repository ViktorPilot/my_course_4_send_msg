{% extends 'service/base.html' %}
{% block title %}message_detail{% endblock %}
{% block content %}
<h1 class="text-center mt-5">Информация о сообщении</h1>
<table class="table table-dark table-striped mt-5">
    <thead>
    <tr>
        <th scope="col" class="text-uppercase">id</th>
        <th scope="col" class="text-uppercase">сообщение</th>
        <th scope="col" class="text-uppercase">текст</th>
        <th scope="col" class="text-uppercase"></th>
        <th scope="col" class="text-uppercase"></th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <th scope="row" class="fst-italic">{{ object.pk }}</th>
        <td class="fst-italic">{{ object.theme }}</td>
        <td class="fst-italic">{{ object.text }}</td>
        <td><a href="{% url 'service:message_update' object.pk %}"><button type="button" class="btn btn-outline-primary btn-sm">Редактировать</button></a></td>
        <td><a href="{% url 'service:message_delete' object.pk %}"><button type="button" class="btn btn-outline-danger btn-sm">Удалить</button></a></td>
    </tr>
</table>
{% endblock %}
