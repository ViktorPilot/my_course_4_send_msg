{% extends 'service/base.html' %}
{% block title %}distribution_list{% endblock %}
{% block content %}
<h1 class="text-center mt-5">Рассылки</h1>
<table class="table table-dark table-striped mt-5">
    <thead>
    <tr>
        <th scope="col" class="text-uppercase">id</th>
        <th scope="col" class="text-uppercase">Дата и время первой отправки</th>
        <th scope="col" class="text-uppercase">Статус</th>
        <th scope="col" class="text-uppercase"></th>
    </tr>
    </thead>
    <tbody>
    {% for object in object_list %}
    <tr>
        <th scope="row" class="fst-italic">{{ object.pk }}</th>
        <td class="fst-italic">{{ object.start_time }}</td>
        <td class="fst-italic">{{ object.status }}</td>
        <td><a href="{% url 'service:distribution_detail' object.pk %}">
            <button type="button" class="btn btn-outline-primary btn-sm">Подробно</button></a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
