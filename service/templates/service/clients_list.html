{% extends 'service/base.html' %}
{% block title %}clients{% endblock %}
{% block content %}
<h1 class="text-center mt-5">Клиенты - получатели рассылки</h1>
<table class="table table-dark table-striped mt-5">
    <thead>
    <tr>
        <th scope="col" class="text-uppercase">id</th>
        <th scope="col" class="text-uppercase">Почта</th>
        <th scope="col" class="text-uppercase">Информация</th>
    </tr>
    </thead>
    <tbody>
    {% for object in object_list %}
    <tr>
        <th scope="row" class="fst-italic">{{ object.pk }}</th>
        <td class="fst-italic">{{ object.email }}</td>
        <td><a href="{% url 'service:clients_detail' object.pk %}">
            <button type="button" class="btn btn-outline-primary btn-sm">Подробно</button></a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
